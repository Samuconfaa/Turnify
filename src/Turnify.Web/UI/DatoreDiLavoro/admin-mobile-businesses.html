<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TurniUp Mobile — Attività</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="turniup.css">
<link rel="stylesheet" href="turniup-mobile.css">
</head>
<body class="m-body" data-page="businesses">
<div class="phone">
  <div class="notch"></div>
  <div class="screen">
    <header class="m-top">
      <button class="m-ico" data-drawer-open aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="m-h">Attività<small>3 sedi attive</small></div>
    </header>

    <div class="m-scroll">
      <div class="m-list" id="bizList" style="margin-top:4px"></div>
    </div>

    <button class="fab" data-sheet-open="sheet-business" aria-label="Nuova attività"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <div id="bizDetailHolder"></div>
  </div>
</div>

<script src="turniup-mobile.js"></script>
<script>
const ICON={
  rist:'<path d="M5 3v7a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V3M7 12v9M16 3c-1.5 0-2.5 2-2.5 5s1 4 2.5 4m0 0v9"/>',
  bar:'<path d="M5 3h14l-6 8v7M5 3l7 8M19 21H7"/>',
  bistrot:'<path d="M5 3v7a2 2 0 0 0 2 2v9M7 12a2 2 0 0 0 2-2V3M15 3c-1.5 1-2.5 3-2.5 6s1 3 2.5 3v9"/>'
};
const biz=[
  {name:'Ristorante Centro',type:'Ristorante · Cucina italiana',addr:'Via Roma 12, Milano',cov:'var(--primary)',ico:'rist',emp:18,sh:57,
   team:[['GF','oklch(0.6 0.13 25)'],['SC','oklch(0.6 0.13 320)'],['FG','oklch(0.52 0.12 180)'],['+15','var(--text-faint)']]},
  {name:'Bar Aurora',type:'Bar · Caffetteria',addr:'Corso Buenos Aires 88, Milano',cov:'var(--green)',ico:'bar',emp:14,sh:41,
   team:[['LB','oklch(0.58 0.12 250)'],['EM','oklch(0.6 0.12 60)'],['AF','oklch(0.6 0.12 100)'],['+11','var(--text-faint)']]},
  {name:'Bistrot Sud',type:'Bistrot · Cucina mediterranea',addr:'Piazza Sole 4, Milano',cov:'var(--amber)',ico:'bistrot',emp:16,sh:28,
   team:[['DG','oklch(0.55 0.11 150)'],['MR','oklch(0.55 0.13 290)'],['+14','var(--text-faint)']]},
];
const bl=document.getElementById('bizList');
biz.forEach((b,idx)=>{const c=document.createElement('div');c.className='m-card tap mr';c.style.animationDelay=(idx*.06)+'s';c.style.padding='0';c.style.overflow='hidden';
  c.innerHTML=`
    <div style="height:78px;display:flex;align-items:center;padding:0 16px;position:relative;background:linear-gradient(135deg,${b.cov},color-mix(in oklab,${b.cov} 60%, black 14%))">
      <div style="width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.2);display:grid;place-items:center;border:1px solid rgba(255,255,255,.3)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:24px;height:24px">${ICON[b.ico]}</svg></div>
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;margin-left:auto;opacity:.85;stroke-width:2.2"><path d="m9 6 6 6-6 6"/></svg>
    </div>
    <div style="padding:14px 16px">
      <div class="mc-name" style="font-family:var(--font-display);font-size:17px">${b.name}</div>
      <div class="mc-sub">${b.type}</div>
      <div class="dot-pip" style="margin-top:9px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;color:var(--text-faint)"><path d="M12 21s7-5.5 7-11a7 7 0 0 0-14 0c0 5.5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>${b.addr}</div>
      <div style="display:flex;gap:24px;margin-top:13px;padding-top:13px;border-top:1px solid var(--border)">
        <div><div style="font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--text)">${b.emp}</div><div style="font-size:11.5px;color:var(--text-muted)">Dipendenti</div></div>
        <div><div style="font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--text)">${b.sh}</div><div style="font-size:11.5px;color:var(--text-muted)">Turni / sett.</div></div>
      </div>
    </div>`;
  c.addEventListener('click',()=>openBiz(b));
  bl.appendChild(c);});

function openBiz(b){
  const avatars=b.team.map(t=>`<div class="avatar" style="background:${t[1]};${t[0][0]==='+'?'font-size:11px':''}">${t[0]}</div>`).join('');
  document.getElementById('bizDetailHolder').innerHTML=window.sheet('sheet-biz-detail',
    ICON[b.ico], b.name, b.type,
    `<div class="det-row"><span class="di"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.5 7-11a7 7 0 0 0-14 0c0 5.5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg></span><div><div class="dl">Indirizzo</div><div class="dv">${b.addr}</div></div></div>
     <div style="padding:15px 0 6px"><div class="dl" style="margin-bottom:10px">Dipendenti assegnati (${b.emp})</div><div class="avatar-stack">${avatars}</div></div>
     <div class="dl" style="margin:14px 0 8px">Turni di oggi</div>
     <div class="shift-mini"><div class="avatar" style="background:${b.team[0][1]}">${b.team[0][0]}</div><div class="si"><div class="sn">Turno mattina</div><div class="sd">Sala</div></div><div class="st"><div class="tt">08:00–14:00</div></div></div>
     <div class="shift-mini"><div class="avatar" style="background:${b.team[1][1]}">${b.team[1][0]}</div><div class="si"><div class="sn">Turno sera</div><div class="sd">Cucina</div></div><div class="st"><div class="tt">17:00–23:00</div></div></div>`,
    `<button class="btn-secondary" data-sheet-open="sheet-business" data-sheet-close>Modifica</button><button class="btn-primary" data-sheet-close>Chiudi</button>`);
  setTimeout(()=>window.openSheet('sheet-biz-detail'),0);
}
</script>
</body>
</html>
