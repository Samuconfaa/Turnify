<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TurniUp Mobile — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="turniup.css">
<link rel="stylesheet" href="turniup-mobile.css">
</head>
<body class="m-body" data-page="dashboard">
<div class="phone">
  <div class="notch"></div>
  <div class="screen">
    <header class="m-top">
      <button class="m-ico" data-drawer-open aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="m-h">Buongiorno, Marco<small>Domenica 1 giugno</small></div>
      <button class="m-ico ghost m-spacer" aria-label="Notifiche"><span class="ndot"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 5 1.5 6.5 1.5 6.5h-15S6 14 6 9ZM10 19a2 2 0 0 0 4 0"/></svg></button>
    </header>

    <div class="m-scroll">
      <!-- KPI rail -->
      <div class="kpi-rail">
        <div class="card kpi-mini mr" style="animation-delay:.04s">
          <div class="kt"><div class="ki ico-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M16 5.2a3 3 0 0 1 0 5.6M18 19a5 5 0 0 0-3-4.6"/></svg></div></div>
          <div class="kv" data-count="48">0</div><div class="kn">Dipendenti attivi</div>
          <div class="kd delta-up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 15l7-7 7 7"/></svg>+3</div>
          <svg class="spark" viewBox="0 0 80 34" preserveAspectRatio="none"><path style="stroke:var(--primary)" d="M2 28 L14 25 L26 27 L38 20 L50 22 L62 14 L78 8"/></svg>
        </div>
        <div class="card kpi-mini mr" style="animation-delay:.1s">
          <div class="kt"><div class="ki ico-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg></div></div>
          <div class="kv" data-count="126">0</div><div class="kn">Turni settimana</div>
          <div class="kd delta-up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 15l7-7 7 7"/></svg>+12%</div>
          <svg class="spark" viewBox="0 0 80 34" preserveAspectRatio="none"><path style="stroke:var(--green)" d="M2 24 L14 26 L26 18 L38 20 L50 12 L62 16 L78 9"/></svg>
        </div>
        <div class="card kpi-mini mr" style="animation-delay:.16s">
          <div class="kt"><div class="ki ico-amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.5 19.5h19L12 3ZM12 9.5v4M12 16.6v.1"/></svg></div></div>
          <div class="kv" data-count="7">0</div><div class="kn">Ferie in attesa</div>
          <div class="kd delta-warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Attenzione</div>
          <svg class="spark" viewBox="0 0 80 34" preserveAspectRatio="none"><path style="stroke:var(--amber)" d="M2 18 L14 20 L26 16 L38 22 L50 17 L62 21 L78 13"/></svg>
        </div>
        <div class="card kpi-mini mr" style="animation-delay:.22s">
          <div class="kt"><div class="ki ico-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></div></div>
          <div class="kv"><span data-count="1284">0</span><span class="unit">h</span></div><div class="kn">Ore programmate</div>
          <div class="kd delta-flat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12h14"/></svg>In linea</div>
          <svg class="spark" viewBox="0 0 80 34" preserveAspectRatio="none"><path style="stroke:var(--text-faint)" d="M2 22 L14 18 L26 20 L38 16 L50 18 L62 15 L78 17"/></svg>
        </div>
      </div>

      <!-- Ferie in attesa -->
      <div class="m-sec-title">Ferie in attesa <a href="admin-mobile-vacations.html">Tutte</a></div>
      <div class="m-list" id="vacList" style="margin-top:0"></div>

      <!-- Turni di oggi -->
      <div class="m-sec-title">Turni di oggi <span class="sub" style="font-weight:500">9 programmati · 2 in corso</span></div>
      <div class="card" style="padding:4px 15px"><div id="shiftList"></div></div>
    </div>

    <button class="fab" data-sheet-open="sheet-shift" aria-label="Nuovo turno"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
</div>

<script src="turniup-mobile.js"></script>
<script>
const vacs=[
  {n:'Martina Russo',i:'MR',type:'Ferie',range:'12 – 19 giu',c:'oklch(0.6 0.13 300)'},
  {n:'Andrea Costa',i:'AC',type:'Permesso',range:'5 giu · 09–13',c:'oklch(0.55 0.12 200)'},
  {n:'Chiara Moretti',i:'CM',type:'Ferie',range:'2 – 4 lug',c:'oklch(0.58 0.13 25)'},
];
const TYPE={Ferie:'badge-primary',Permesso:'badge-muted',Malattia:'badge-amber'};
const vl=document.getElementById('vacList');
vacs.forEach((v,idx)=>{const el=document.createElement('div');el.className='m-card mr';el.style.animationDelay=(.28+idx*.06)+'s';
  el.innerHTML=`<div class="mc-row"><div class="avatar" style="background:${v.c}">${v.i}</div>
    <div style="flex:1"><div class="mc-name">${v.n}</div><div class="mc-sub">${v.type}</div></div>
    <span class="badge ${TYPE[v.type]}">${v.type}</span></div>
    <div class="mc-meta"><span class="dot-pip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;color:var(--text-faint)"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg>${v.range}</span></div>
    <div class="vac-act"><button class="btn-approve" data-toast="Richiesta approvata" onclick="window.__t(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="m5 13 4 4L19 7"/></svg>Approva</button>
      <button class="btn-reject" data-toast="Richiesta rifiutata" onclick="window.__t(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M6 6l12 12M18 6 6 18"/></svg>Rifiuta</button></div>`;
  vl.appendChild(el);});

const palette={primary:'var(--primary)',green:'var(--green)',amber:'var(--amber)'};
const shifts=[
  {n:'Giulia Ferrari',i:'GF',biz:'Ristorante Centro',bz:'primary',t:'08:00–14:00',st:['badge-green','In corso'],c:'oklch(0.6 0.13 25)'},
  {n:'Luca Bianchi',i:'LB',biz:'Bar Aurora',bz:'green',t:'07:30–13:30',st:['badge-green','In corso'],c:'oklch(0.58 0.12 250)'},
  {n:'Sara Conti',i:'SC',biz:'Ristorante Centro',bz:'primary',t:'12:00–18:00',st:['badge-primary','Programmato'],c:'oklch(0.6 0.13 320)'},
  {n:'Davide Greco',i:'DG',biz:'Bistrot Sud',bz:'amber',t:'15:00–23:00',st:['badge-primary','Programmato'],c:'oklch(0.55 0.11 150)'},
];
const sl=document.getElementById('shiftList');
shifts.forEach(s=>{const el=document.createElement('div');el.className='shift-mini';
  el.innerHTML=`<div class="avatar" style="background:${s.c}">${s.i}</div>
    <div class="si"><div class="sn">${s.n}</div><div class="sd"><span class="pip" style="background:${palette[s.bz]}"></span>${s.biz}</div></div>
    <div class="st"><div class="tt">${s.t}</div><span class="badge ${s.st[0]}" style="margin-top:4px"><span class="bdot"></span>${s.st[1]}</span></div>`;
  sl.appendChild(el);});

window.__t=function(btn){const card=btn.closest('.m-card');if(card){card.style.transition='opacity .25s, transform .25s';card.style.opacity='0';card.style.transform='scale(.96)';setTimeout(()=>card.remove(),260);} if(window.openSheet){} 
  const w=document.querySelector('.toast-wrap')||(()=>{const x=document.createElement('div');x.className='toast-wrap';document.querySelector('.screen').appendChild(x);return x;})();
  const t=document.createElement('div');t.className='toast';t.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;stroke-width:2.4;color:var(--green)"><path d="m5 13 4 4L19 7"/></svg><span>'+btn.dataset.toast+'</span>';
  w.appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),320);},2400);};

window.addEventListener('load',()=>setTimeout(()=>document.querySelectorAll('[data-count]').forEach(el=>countUp(el,+el.dataset.count)),250));
</script>
</body>
</html>
