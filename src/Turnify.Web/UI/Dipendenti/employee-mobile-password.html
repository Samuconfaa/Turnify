<!DOCTYPE html>
<html lang="it" data-page="profilo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambia password · TurniUp Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="turniup.css">
<link rel="stylesheet" href="turniup-mobile.css">
</head>
<body class="m-body">
<div class="device">
  <div class="screen">
    <div class="statusbar" id="statusbar"></div>

    <header class="m-topbar">
      <a class="m-back" href="employee-mobile-profilo.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Profilo</a>
      <div class="grow"></div>
      <h1 style="font-size:17px">Password</h1>
      <div class="grow"></div>
      <div style="width:74px"></div>
    </header>

    <main class="m-content no-tabbar">
      <div style="text-align:center;padding:18px 0 8px">
        <div style="width:64px;height:64px;border-radius:50%;background:var(--primary-soft);color:var(--primary-strong);display:grid;place-items:center;margin:0 auto 12px"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
        <p style="color:var(--text-muted);font-size:13.5px;max-width:30ch;margin:0 auto">Usa almeno 8 caratteri con una maiuscola e un numero.</p>
      </div>

      <form id="pw-form" style="display:flex;flex-direction:column;gap:16px;margin-top:10px">
        <div class="field"><label for="pw-cur">Password attuale</label><input class="input" id="pw-cur" type="password" placeholder="••••••••"></div>
        <div class="field"><label for="pw-new">Nuova password</label><input class="input" id="pw-new" type="password" placeholder="Nuova password"><span class="field-msg"></span></div>
        <div class="field"><label for="pw-conf">Conferma nuova password</label><input class="input" id="pw-conf" type="password" placeholder="Ripeti la password"><span class="field-msg"></span></div>
        <button class="btn btn-primary btn-lg" type="submit" style="margin-top:6px">Aggiorna password</button>
      </form>
    </main>
  </div>
</div>
<script src="mobile-nav.js"></script>
<script>
  var nw=document.getElementById("pw-new"), cf=document.getElementById("pw-conf"), form=document.getElementById("pw-form");
  function validate(){
    var fN=nw.closest(".field"), fC=cf.closest(".field");
    var strong = nw.value.length>=8 && /[A-Z]/.test(nw.value) && /[0-9]/.test(nw.value);
    fN.classList.toggle("ok", strong); fN.classList.toggle("error", nw.value.length>0 && !strong);
    fN.querySelector(".field-msg").textContent = nw.value.length===0 ? "" : (strong ? "Sicurezza: buona" : "Aggiungi maiuscola e numero (min. 8)");
    var match = cf.value.length>0 && cf.value===nw.value;
    fC.classList.toggle("ok", match); fC.classList.toggle("error", cf.value.length>0 && !match);
    fC.querySelector(".field-msg").textContent = cf.value.length===0 ? "" : (match ? "Le password coincidono" : "Le password non coincidono");
    return strong && match;
  }
  nw.addEventListener("input", validate);
  cf.addEventListener("input", validate);
  form.addEventListener("submit", function(e){
    e.preventDefault();
    if(validate()){ MTU.toast("Password aggiornata","green"); form.reset(); validate(); }
    else { MTU.toast("Controlla i campi evidenziati"); }
  });
</script>
</body>
</html>
