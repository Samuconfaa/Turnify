<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<style>

  html, body { margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, system-ui, sans-serif; }

<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tokens.jsx"></script>

<script type="text/babel" src="screens-misc.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel" data-presets="react">

// Master phone-pair component — renders the same screen in light + dark in one artboard
function PhonePair({ children, tabBar, role, tabActive, showTabBar = true, hideStatus = false }) {
  const tL = window.TURNIFY_TOKENS.light;
  const tD = window.TURNIFY_TOKENS.dark;
  const W = 360, H = 760;
  return (
    <div style={{ display: 'flex', gap: 24, padding: '32px 24px', justifyContent: 'center', alignItems: 'flex-start' }}>
      <div>
        <div style={{
          fontSize: 10.5, fontWeight: 600, color: 'rgba(60,50,40,0.7)',
          letterSpacing: 1.2, textTransform: 'uppercase', marginBottom: 10, paddingLeft: 4,
        }}>Light</div>
        <Phone t={tL} dark={false} width={W} height={H} tabBar={showTabBar && <TabBar t={tL} active={tabActive} role={role}/>} hideStatus={hideStatus}>
          {children({ t: tL, dark: false })}
        </Phone>
      </div>
      <div>
        <div style={{
          fontSize: 10.5, fontWeight: 600, color: 'rgba(60,50,40,0.7)',
          letterSpacing: 1.2, textTransform: 'uppercase', marginBottom: 10, paddingLeft: 4,
        }}>Dark</div>
        <Phone t={tD} dark={true} width={W} height={H} tabBar={showTabBar && <TabBar t={tD} active={tabActive} role={role}/>} hideStatus={hideStatus}>
          {children({ t: tD, dark: true })}
        </Phone>
      </div>
    </div>
  );
}

// Solo phone — for variants
function SoloPhone({ children, dark = false, role, tabActive, showTabBar = false, label }) {
  const t = dark ? window.TURNIFY_TOKENS.dark : window.TURNIFY_TOKENS.light;
  const W = 360, H = 760;
  return (
    <div style={{ display: 'flex', padding: '32px 24px', justifyContent: 'center', flexDirection: 'column', alignItems: 'center', gap: 10 }}>
      {label && (
        <div style={{
          fontSize: 10.5, fontWeight: 600, color: 'rgba(60,50,40,0.7)',
          letterSpacing: 1.2, textTransform: 'uppercase',
        }}>{label}</div>
      )}
      <Phone t={t} dark={dark} width={W} height={H} tabBar={showTabBar && <TabBar t={t} active={tabActive} role={role}/>}>
        {children({ t, dark })}
      </Phone>
    </div>
  );
}

// Design tokens preview card
function TokensCard() {
  const tL = window.TURNIFY_TOKENS.light;
  const swatches = [
    { name: 'Primary', v: '#006948', text: '#FFF' },
    { name: 'Primary Light', v: '#D1FAE5', text: '#005137' },
    { name: 'Background', v: '#F5FBF5', text: '#171D19' },
    { name: 'Surface', v: '#FFFFFF', text: '#171D19', border: true },
    { name: 'Surface Low', v: '#EFF5EF', text: '#171D19' },
    { name: 'Text', v: '#171D19', text: '#FFF' },
    { name: 'Text Secondary', v: '#3D4A42', text: '#FFF' },
    { name: 'Border', v: '#BCCAC0', text: '#171D19' },
    { name: 'KPI Amber', v: '#F59E0B', text: '#FFF' },
    { name: 'KPI Blue', v: '#0284C7', text: '#FFF' },
    { name: 'Danger', v: '#BA1A1A', text: '#FFF' },
    { name: 'Success bg', v: '#D1FAE5', text: '#005137' },
  ];
  const darkSw = [
    { name: 'Background', v: '#0D1510', text: '#E2F0E6' },
    { name: 'Surface', v: '#162019', text: '#E2F0E6' },
    { name: 'Primary', v: '#68DBA9', text: '#0D1510' },
    { name: 'Text', v: '#E2F0E6', text: '#0D1510' },
    { name: 'Text Secondary', v: '#A3B5A8', text: '#0D1510' },
    { name: 'Border', v: '#3A4D41', text: '#E2F0E6' },
  ];
  return (
    <div style={{ padding: 32, fontFamily: window.TURNIFY_FONT, width: 760, background: '#FFF', borderRadius: 16 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 6 }}>
        <Logo size={44} />
        <div>
          <div style={{ fontSize: 24, fontWeight: 700, color: '#171D19', letterSpacing: -0.4 }}>Turnify · Design System</div>
          <div style={{ fontSize: 13, color: '#3D4A42', marginTop: 2 }}>Mobile app · iOS & Android · Italian</div>
        </div>
      </div>
      <div style={{ height: 1, background: '#BCCAC0', margin: '20px 0 24px' }}/>

      <div style={{ fontSize: 11, fontWeight: 600, color: '#3D4A42', letterSpacing: 0.8, textTransform: 'uppercase', marginBottom: 10 }}>Light palette</div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 8, marginBottom: 22 }}>
        {swatches.map((s, i) => (
          <div key={i} style={{
            background: s.v, color: s.text, padding: 12, borderRadius: 12, height: 88,
            display: 'flex', flexDirection: 'column', justifyContent: 'space-between',
            border: s.border ? '1px solid #BCCAC0' : 'none',
          }}>
            <div style={{ fontSize: 11, fontWeight: 600, opacity: 0.85 }}>{s.name}</div>
            <div style={{ fontSize: 13, fontWeight: 700, letterSpacing: -0.2, fontVariantNumeric: 'tabular-nums' }}>{s.v}</div>
          </div>
        ))}
      </div>

      <div style={{ fontSize: 11, fontWeight: 600, color: '#3D4A42', letterSpacing: 0.8, textTransform: 'uppercase', marginBottom: 10 }}>Dark palette</div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8, marginBottom: 22 }}>
        {darkSw.map((s, i) => (
          <div key={i} style={{
            background: s.v, color: s.text, padding: 12, borderRadius: 12, height: 76,
            display: 'flex', flexDirection: 'column', justifyContent: 'space-between',
          }}>
            <div style={{ fontSize: 11, fontWeight: 600, opacity: 0.85 }}>{s.name}</div>
            <div style={{ fontSize: 13, fontWeight: 700, letterSpacing: -0.2, fontVariantNumeric: 'tabular-nums' }}>{s.v}</div>
          </div>
        ))}
      </div>

      <div style={{ fontSize: 11, fontWeight: 600, color: '#3D4A42', letterSpacing: 0.8, textTransform: 'uppercase', marginBottom: 12 }}>Tipografia · Plus Jakarta Sans</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginBottom: 22 }}>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 16 }}>
          <div style={{ fontSize: 22, fontWeight: 600, color: '#171D19', letterSpacing: -0.4, flex: '0 0 220px' }}>Heading pagina</div>
          <div style={{ fontSize: 11, color: '#3D4A42', fontFamily: 'monospace' }}>SemiBold · 22 / 26</div>
        </div>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 16 }}>
          <div style={{ fontSize: 15, fontWeight: 600, color: '#171D19', flex: '0 0 220px' }}>Titolo card / sezione</div>
          <div style={{ fontSize: 11, color: '#3D4A42', fontFamily: 'monospace' }}>SemiBold · 15 / 20</div>
        </div>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 16 }}>
          <div style={{ fontSize: 14, color: '#171D19', flex: '0 0 220px' }}>Body — testo descrittivo</div>
          <div style={{ fontSize: 11, color: '#3D4A42', fontFamily: 'monospace' }}>Regular · 14 / 20</div>
        </div>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 16 }}>
          <div style={{ fontSize: 11, fontWeight: 600, color: '#3D4A42', letterSpacing: 0.8, flex: '0 0 220px', textTransform: 'uppercase' }}>Caption · label sezione</div>
          <div style={{ fontSize: 11, color: '#3D4A42', fontFamily: 'monospace' }}>SemiBold · 11 · LS 0.8</div>
        </div>
      </div>

      <div style={{ fontSize: 11, fontWeight: 600, color: '#3D4A42', letterSpacing: 0.8, textTransform: 'uppercase', marginBottom: 12 }}>Bottoni & input</div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
        <PrimaryBtn t={tL}>Accedi</PrimaryBtn>
        <OutlineBtn t={tL}>Registrati</OutlineBtn>
        <DangerBtn t={tL} outline>Disattiva</DangerBtn>
        <div style={{ display: 'flex', gap: 8 }}>
          <SmallPill bg={tL.primary} color="#FFF" style={{ height: 50, padding: '0 18px' }}>Approva</SmallPill>
          <SmallPill bg="transparent" color={tL.danger} style={{ height: 50, padding: '0 18px', border: `1px solid ${tL.danger}` }}>Rifiuta</SmallPill>
        </div>
        <Input t={tL} label="Email" value="laura@nordcafe.it" leading={<Icon name="mail" size={18} color="#3D4A42"/>}/>
        <Input t={tL} label="Password" value="••••••••" focused leading={<Icon name="lock" size={18} color={tL.primary}/>} trailing={<Icon name="eye" size={18} color="#3D4A42"/>}/>
      </div>

      <div style={{ marginTop: 24, fontSize: 11, fontWeight: 600, color: '#3D4A42', letterSpacing: 0.8, textTransform: 'uppercase', marginBottom: 12 }}>Badges & chips</div>
      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
        <StatusBadge t={tL} kind="approved"/>
        <StatusBadge t={tL} kind="pending"/>
        <StatusBadge t={tL} kind="rejected"/>
        <StatusBadge t={tL} kind="today"/>
        <StatusBadge t={tL} kind="active" dot/>
        <StatusBadge t={tL} kind="inactive" dot/>
        <div style={{ width: 12 }}/>
        <Chip t={tL} label="Tutte" active/>
        <Chip t={tL} label="In attesa"/>
        <Chip t={tL} label="Approvate"/>
      </div>
    </div>
  );
}

function TabBarDemo({ dark }) {
  const t = dark ? window.TURNIFY_TOKENS.dark : window.TURNIFY_TOKENS.light;
  return (
    <div style={{ padding: 28, fontFamily: window.TURNIFY_FONT, background: t.bg, borderRadius: 16, width: 720, display: 'flex', flexDirection: 'column', gap: 18 }}>
      <div style={{ fontSize: 13, fontWeight: 600, color: t.text }}>Admin · 5 tab</div>
      <TabBar t={t} active={0} role="admin"/>
      <div style={{ fontSize: 13, fontWeight: 600, color: t.text, marginTop: 8 }}>Dipendente · 5 tab</div>
      <TabBar t={t} active={1} role="employee"/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(

    <DCSection id="ds" title="Design System" subtitle="Palette · type · components">
      <DCArtboard id="tokens" label="Tokens & components" width={820} height={1620}>

      <DCArtboard id="tabbars-light" label="Tab bar — light" width={780} height={300}>
        <TabBarDemo dark={false}/>
      </DCArtboard>
      <DCArtboard id="tabbars-dark" label="Tab bar — dark" width={780} height={300}>
        <TabBarDemo dark={true}/>
      </DCArtboard>
    </DCSection>

    <DCSection id="auth" title="Auth flow" subtitle="Selezione ruolo · login · registrazione · recupero · onboarding">
      <DCArtboard id="role" label="01 · Selezione ruolo" width={840} height={880}>

      </DCArtboard>

      </DCArtboard>
      <DCArtboard id="onb-0" label="05a · Onboarding — Benvenuto" width={840} height={880}>

      </DCArtboard>

      </DCArtboard>
      <DCArtboard id="onb-2" label="05c · Onboarding — Primo dipendente" width={840} height={880}>

      </DCArtboard>
    </DCSection>

    <DCSection id="dash" title="Dashboard" subtitle="Vista principale Admin e Dipendente">
      <DCArtboard id="dash-admin" label="06 · Dashboard Admin" width={840} height={880}>
        <PhonePair tabActive={0} role="admin">{({ t, dark }) => <S_DashAdmin t={t} dark={dark}/>}</PhonePair>
      </DCArtboard>
      <DCArtboard id="dash-emp" label="07 · Dashboard Dipendente" width={840} height={880}>

    <DCSection id="shifts" title="Turni" subtitle="Vista calendario · scambi turno · dettaglio">

      <DCArtboard id="shifts-admin" label="09 · Griglia turni · Admin" width={840} height={880}>

      </DCArtboard>
      <DCArtboard id="shift-detail-new" label="10b · Nuovo turno (sheet)" width={840} height={880}>
        <PhonePair showTabBar={false}>{({ t, dark }) => <S_ShiftDetail t={t} dark={dark} edit={false}/>}</PhonePair>
      </DCArtboard>
      <DCArtboard id="swaps" label="11 · Scambi turno" width={840} height={880}>
        <PhonePair showTabBar={false}>{({ t, dark }) => <S_Swaps t={t} dark={dark}/>}</PhonePair>
      </DCArtboard>
    </DCSection>

    <DCSection id="leave" title="Ferie" subtitle="Lista richieste · nuova richiesta">

        <PhonePair tabActive={2} role="employee">{({ t, dark }) => <S_LeaveList t={t} dark={dark} role="admin"/>}</PhonePair>
      </DCArtboard>
      <DCArtboard id="leave-emp" label="12b · Lista ferie · Dipendente" width={840} height={880}>

      </DCArtboard>

        <PhonePair showTabBar={false}>{({ t, dark }) => <S_LeaveNew t={t} dark={dark}/>}</PhonePair>
      </DCArtboard>

    <DCSection id="notifs" title="Notifiche · Profilo">
      <DCArtboard id="notifs" label="13 · Notifiche" width={840} height={880}>
        <PhonePair tabActive={3} role="admin">{({ t, dark }) => <S_Notifs t={t} dark={dark}/>}</PhonePair>
      </DCArtboard>
      <DCArtboard id="profile-admin" label="14a · Profilo · Admin" width={840} height={880}>

      </DCArtboard>
      <DCArtboard id="profile-emp" label="14b · Profilo · Dipendente" width={840} height={880}>

      <DCArtboard id="biz-list" label="17 · Lista attività" width={840} height={880}>

      </DCArtboard>
      <DCArtboard id="hours" label="19 · Orari di apertura" width={840} height={880}>
        <PhonePair showTabBar={false}>{({ t, dark }) => <S_Hours t={t} dark={dark}/>}</PhonePair>
      </DCArtboard>
    </DCSection>

    <DCSection id="reports" title="Report & strumenti" subtitle="Export · presenze · disponibilità · GDPR">
      <DCArtboard id="report" label="20 · Report (export)" width={840} height={880}>
        <PhonePair showTabBar={false}>{({ t, dark }) => <S_Report t={t} dark={dark}/>}</PhonePair>
      </DCArtboard>
      <DCArtboard id="hours-report" label="21 · Report ore dipendenti" width={840} height={880}>
        <PhonePair showTabBar={false}>{({ t, dark }) => <S_HoursReport t={t} dark={dark}/>}</PhonePair>
      </DCArtboard>
      <DCArtboard id="attendance" label="22 · Storico presenze" width={840} height={880}>
        <PhonePair showTabBar={false}>{({ t, dark }) => <S_Attendance t={t} dark={dark}/>}</PhonePair>
      </DCArtboard>
      <DCArtboard id="availability" label="23 · Disponibilità" width={840} height={880}>
        <PhonePair showTabBar={false}>{({ t, dark }) => <S_Availability t={t} dark={dark}/>}</PhonePair>
      </DCArtboard>
      <DCArtboard id="gdpr" label="24 · GDPR · I tuoi dati" width={840} height={880}>
        <PhonePair showTabBar={false}>{({ t, dark }) => <S_GDPR t={t} dark={dark}/>}</PhonePair>
      </DCArtboard>
    </DCSection>
  </DesignCanvas>
);
</script>
</body>
</html>
