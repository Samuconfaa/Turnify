<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TurniUp Mobile — Log errori</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="turniup.css">
<link rel="stylesheet" href="turniup-mobile.css">
</head>
<body class="m-body" data-page="errors">
<div class="phone">
  <div class="notch"></div>
  <div class="screen">
    <header class="m-top">
      <button class="m-ico" data-drawer-open aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="m-h">Log errori<small>42 eventi · ultime 24h</small></div>
      <div class="select m-spacer" style="margin-left:auto"><select style="font-size:12.5px;padding:7px 28px 7px 11px"><option>24 ore</option><option>7 giorni</option><option>30 giorni</option></select><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></div>
    </header>

    <div class="m-scroll">
      <div class="chip-rail" style="margin-top:4px">
        <button class="chip on">Tutti <span class="cc">42</span></button>
        <button class="chip">Errore <span class="cc">18</span></button>
        <button class="chip">Warning <span class="cc">15</span></button>
        <button class="chip">Info <span class="cc">9</span></button>
      </div>
      <div class="m-list" id="logList"></div>
    </div>
    <div id="logDetailHolder"></div>
  </div>
</div>

<script src="turniup-mobile.js"></script>
<script>
const PLAT={
  ios:'<span class="plat-tag"><svg viewBox="0 0 24 24" fill="currentColor" style="width:13px;height:13px"><path d="M16.4 12.8c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.8-.9-3-.8c-1.5 0-3 .9-3.7 2.3-1.6 2.8-.4 6.9 1.1 9.2.8 1.1 1.6 2.3 2.8 2.3 1.1 0 1.5-.7 2.9-.7s1.7.7 2.9.7 2-1.1 2.7-2.1c.9-1.3 1.2-2.5 1.3-2.6-.1 0-2.5-1-2.5-3.8M14.3 5.9c.6-.8 1-1.8.9-2.9-.9 0-2 .6-2.6 1.4-.6.7-1.1 1.7-.9 2.7 1 .1 2-.5 2.6-1.2"/></svg>iOS</span>',
  android:'<span class="plat-tag"><svg viewBox="0 0 24 24" fill="currentColor" style="width:13px;height:13px"><path d="M6 9v7a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V9H6Zm12.5 0A1.5 1.5 0 0 0 17 10.5v4a1.5 1.5 0 0 0 3 0v-4A1.5 1.5 0 0 0 18.5 9ZM4.5 9A1.5 1.5 0 0 0 3 10.5v4a1.5 1.5 0 0 0 3 0v-4A1.5 1.5 0 0 0 4.5 9ZM7.5 7.5h9C16.5 5.3 14.5 3.5 12 3.5S7.5 5.3 7.5 7.5Z"/></svg>Android</span>'
};
const logs=[
  {time:'14:22:08',plat:'ios',lvl:['lvl-err','Errore'],msg:'<code>RangeError</code> Index out of range in ShiftListView',device:'iPhone 14 · iOS 17.4',ver:'2.3.1',user:'g.ferrari',
   stack:`<span class="err">RangeError: Index 9 beyond bounds [0...8]</span>\n<span class="at">  at</span> <span class="fn">ShiftListView.cellForRow</span>\n     (<span class="file">ShiftListView.swift:142</span>)\n<span class="at">  at</span> <span class="fn">UITableView.layoutSubviews</span>\n<span class="at">  at</span> <span class="fn">ShiftCoordinator.reload</span>\n     (<span class="file">ShiftCoordinator.swift:88</span>)`},
  {time:'13:47:51',plat:'android',lvl:['lvl-warn','Warning'],msg:'<code>NetworkTimeout</code> Richiesta /shifts scaduta dopo 30s',device:'Pixel 7 · Android 14',ver:'2.3.1',user:'l.bianchi',
   stack:`<span class="err">java.net.SocketTimeoutException: timeout</span>\n<span class="at">  at</span> <span class="fn">Http2Stream.read</span>\n     (<span class="file">Http2Stream.kt:678</span>)\n<span class="at">  at</span> <span class="fn">ApiService.getShifts</span>\n     (<span class="file">ApiService.kt:94</span>)`},
  {time:'11:12:33',plat:'ios',lvl:['lvl-err','Errore'],msg:'<code>NSError</code> Decodifica JSON fallita: chiave "endTime" mancante',device:'iPhone 13 · iOS 16.7',ver:'2.3.0',user:'s.conti',
   stack:`<span class="err">DecodingError.keyNotFound("endTime")</span>\n<span class="at">  at</span> <span class="fn">Shift.init(from:)</span>\n     (<span class="file">Shift.swift:34</span>)\n<span class="at">  at</span> <span class="fn">JSONDecoder.decode</span>`},
  {time:'09:05:17',plat:'android',lvl:['lvl-warn','Warning'],msg:'<code>MemoryWarning</code> Cache immagini sopra soglia (180 MB)',device:'Samsung S23 · Android 14',ver:'2.3.1',user:'d.greco',
   stack:`<span class="err">onTrimMemory(TRIM_MEMORY_RUNNING_LOW)</span>\n<span class="at">  at</span> <span class="fn">ImageCache.purge</span>\n     (<span class="file">ImageCache.kt:55</span>)`},
  {time:'08:31:44',plat:'ios',lvl:['lvl-info','Info'],msg:'<code>SyncCompleted</code> Sincronizzazione turni completata (126 record)',device:'iPhone 12 · iOS 17.2',ver:'2.3.0',user:'e.marino',
   stack:`<span class="at">[INFO]</span> Sync finished in 1.24s\n<span class="at">  at</span> <span class="fn">SyncManager.complete</span>\n     (<span class="file">SyncManager.swift:201</span>)`},
];
const ll=document.getElementById('logList');
logs.forEach((l,idx)=>{const c=document.createElement('div');c.className='log-card mr';c.style.animationDelay=(idx*.05)+'s';
  c.innerHTML=`<div class="lc-top"><span class="lvl ${l.lvl[0]}"><span class="bdot"></span>${l.lvl[1]}</span>${PLAT[l.plat]}<span class="lc-time">${l.time}</span></div>
    <div class="lc-msg">${l.msg}</div>`;
  c.addEventListener('click',()=>openLog(l));
  ll.appendChild(c);});

function openLog(l){
  document.getElementById('logDetailHolder').innerHTML=window.sheet('sheet-log',
    '<path d="M12 9v4m0 4h.01M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>',
    l.lvl[1], l.time+' · v'+l.ver,
    `<div style="margin-bottom:14px">${l.msg.replace('<code>','<code style="font-size:14px">')}</div>
     <div class="log-tags" style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">
       <div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--text-muted)">Dispositivo</span><b style="font-family:var(--font-mono)">${l.device}</b></div>
       <div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--text-muted)">Versione app</span><b style="font-family:var(--font-mono)">${l.ver}</b></div>
       <div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--text-muted)">Utente</span><b style="font-family:var(--font-mono)">${l.user}</b></div>
     </div>
     <div class="dl" style="margin-bottom:8px">Stack trace</div>
     <pre class="stack">${l.stack}</pre>`,
    `<button class="btn-secondary" data-sheet-close>Chiudi</button><button class="btn-primary" data-sheet-save data-toast="Log copiato"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copia</button>`);
  setTimeout(()=>window.openSheet('sheet-log'),0);
}
</script>
</body>
</html>
