<!DOCTYPE html>
<html lang="it" data-page="profilo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profilo · TurniUp Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="turniup.css">
<link rel="stylesheet" href="turniup-mobile.css">
</head>
<body class="m-body">
<div class="device">
  <div class="screen">
    <div class="statusbar" id="statusbar"></div>

    <header class="m-topbar">
      <img class="mt-logo" src="../image/splash.png" alt="TurniUp">
      <h1 style="font-size:18px">Profilo</h1>
    </header>

    <main class="m-content">
      <!-- IDENTITÀ -->
      <div style="text-align:center;padding:8px 0 18px">
        <div style="width:80px;height:80px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:32px;margin:0 auto 12px;box-shadow:0 10px 24px -10px var(--primary)">SR</div>
        <h2 style="font-size:21px">Sara Ricci</h2>
        <div style="color:var(--text-muted);font-size:14px;margin-top:2px">Addetta vendite · Cassa Nord</div>
      </div>

      <!-- INFO -->
      <div class="m-section-label">Informazioni</div>
      <div class="set-list">
        <div class="set-row">
          <div class="s-ic2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M4 7l8 6 8-6"/></svg></div>
          <div><div class="s-k">Email</div><div class="s-v">sara.ricci@turniup.it</div></div>
        </div>
        <div class="set-row">
          <div class="s-ic2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L20 13l2 4v4a14 14 0 0 1-17-17z"/></svg></div>
          <div><div class="s-k">Telefono</div><div class="s-v mono">+39 348 552 1190</div></div>
        </div>
        <div class="set-row">
          <div class="s-ic2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg></div>
          <div><div class="s-k">Matricola</div><div class="s-v mono">TU-0428</div></div>
        </div>
      </div>

      <!-- SICUREZZA -->
      <div class="m-section-label" style="margin-top:22px">Sicurezza</div>
      <div class="set-list">
        <a class="set-row" href="employee-mobile-password.html">
          <div class="s-ic2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
          <div class="s-v">Cambia password</div>
          <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>
        </a>
        <button class="set-row" data-action="theme" style="width:100%;text-align:left">
          <div class="s-ic2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></div>
          <div class="s-v">Aspetto chiaro / scuro</div>
          <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>
        </button>
      </div>

      <!-- LOGOUT -->
      <div class="set-list" style="margin-top:14px">
        <a class="set-row danger" href="#">
          <div class="s-ic2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></div>
          <div class="s-v">Esci dall'account</div>
        </a>
      </div>

      <p style="text-align:center;color:var(--text-faint);font-size:11.5px;margin-top:18px">TurniUp · versione 2.4.1</p>
    </main>

    <nav class="tabbar" id="tabbar"></nav>
  </div>
</div>
<script src="mobile-nav.js"></script>
</body>
</html>
